<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Poll – Results</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-mode="results">
<main class="wide">
  <p class="tag">Live Poll · vote at <strong id="voteUrl"></strong></p>
  <h1 id="question">Loading…</h1>
  <div id="bars" class="bars"></div>
  <p id="total" class="status" role="status"></p>
  <details>
    <summary>Start a new poll</summary>
    <form id="newPoll">
      <label>Question <input name="question" maxlength="200" required></label>
      <label>Options (one per line, 2 to 8)
        <textarea name="options" rows="5" required></textarea>
      </label>
      <button type="submit">Start poll</button>
      <p id="formError" class="error" role="alert"></p>
    </form>
  </details>
</main>
<script src="/app.js"></script>
</body>
</html>
